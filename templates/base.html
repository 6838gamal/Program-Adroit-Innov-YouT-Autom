<!DOCTYPE html>
<html lang="ar" dir="rtl" x-data="{ sidebarOpen: false }">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Content Platform{% endblock %} — منصة إنتاج المحتوى</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 900: '#1e3a8a' },
                        surface: { DEFAULT: '#0f172a', card: '#1e293b', border: '#334155' }
                    }
                }
            }
        }
    </script>
    <style>
        [x-cloak] { display: none !important; }
        body { background: #0f172a; color: #e2e8f0; font-family: 'Segoe UI', system-ui, sans-serif; }
        .nav-link { @apply flex items-center gap-3 px-3 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-700 transition-all text-sm; }
        .nav-link.active { @apply bg-blue-600 text-white; }
        .card { @apply bg-slate-800 rounded-xl border border-slate-700 p-5; }
        .badge { @apply inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium; }
        .btn-primary { @apply bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors; }
        .btn-secondary { @apply bg-slate-700 hover:bg-slate-600 text-slate-200 px-4 py-2 rounded-lg text-sm font-medium transition-colors; }
        .btn-danger { @apply bg-red-600 hover:bg-red-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors; }
        .input { @apply bg-slate-700 border border-slate-600 text-white rounded-lg px-3 py-2 text-sm w-full focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent; }
        .status-draft { @apply badge bg-slate-700 text-slate-300; }
        .status-in_production { @apply badge bg-amber-900 text-amber-300; }
        .status-rendered { @apply badge bg-green-900 text-green-300; }
        .status-published { @apply badge bg-blue-900 text-blue-300; }
        .status-failed { @apply badge bg-red-900 text-red-300; }
        .status-pending { @apply badge bg-slate-700 text-slate-300; }
        .status-processing { @apply badge bg-amber-900 text-amber-300; }
        .status-completed { @apply badge bg-green-900 text-green-300; }
        .progress-bar { transition: width 0.5s ease; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
    </style>
    {% block head %}{% endblock %}
</head>
<body class="min-h-screen">
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-64 flex-shrink-0 bg-slate-900 border-l border-slate-700 flex flex-col">
            <!-- Logo -->
            <div class="p-5 border-b border-slate-700">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center">
                        <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.069A1 1 0 0121 8.87v6.26a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                    </div>
                    <div>
                        <div class="text-white font-semibold text-sm">Content Platform</div>
                        <div class="text-slate-500 text-xs">MVP v1.0</div>
                    </div>
                </div>
            </div>

            <!-- Navigation -->
            <nav class="flex-1 p-3 space-y-1 overflow-y-auto">
                <a href="/" class="nav-link {% if active_page == 'dashboard' %}active{% endif %}">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                    لوحة التحكم
                </a>
                <a href="/projects" class="nav-link {% if active_page == 'projects' %}active{% endif %}">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
                    المشاريع
                </a>
                <a href="/assets" class="nav-link {% if active_page == 'assets' %}active{% endif %}">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                    مكتبة الأصول
                </a>
                <a href="/render-queue" class="nav-link {% if active_page == 'render_queue' %}active{% endif %}">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                    قائمة الرندر
                </a>
                <a href="/publishing-queue" class="nav-link {% if active_page == 'publishing_queue' %}active{% endif %}">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/></svg>
                    قائمة النشر
                </a>
                <a href="/platforms" class="nav-link {% if active_page == 'platforms' %}active{% endif %}">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/></svg>
                    المنصات
                </a>
                <div class="pt-3 pb-1 px-3 text-xs text-slate-500 uppercase tracking-wider">النظام</div>
                <a href="/api/v1/health" target="_blank" class="nav-link">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    صحة النظام
                </a>
                <a href="/docs" target="_blank" class="nav-link">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                    توثيق API
                </a>
            </nav>
        </aside>

        <!-- Main content -->
        <main class="flex-1 overflow-auto">
            <!-- Top bar -->
            <header class="sticky top-0 z-10 bg-slate-900/80 backdrop-blur border-b border-slate-700 px-6 py-3 flex items-center justify-between">
                <h1 class="text-lg font-semibold text-white">{% block page_title %}{% endblock %}</h1>
                <div class="flex items-center gap-3">
                    {% block header_actions %}{% endblock %}
                </div>
            </header>

            <!-- Page content -->
            <div class="p-6">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <!-- Toast notifications -->
    <div id="toasts" class="fixed top-4 left-4 z-50 space-y-2"></div>

    <script>
        // Toast helper
        function showToast(message, type = 'success') {
            const colors = { success: 'bg-green-800 border-green-600', error: 'bg-red-800 border-red-600', info: 'bg-blue-800 border-blue-600' };
            const el = document.createElement('div');
            el.className = `${colors[type] || colors.info} border text-white text-sm px-4 py-3 rounded-lg shadow-lg transition-all`;
            el.textContent = message;
            document.getElementById('toasts').appendChild(el);
            setTimeout(() => el.remove(), 4000);
        }

        // HTMX event listeners
        document.body.addEventListener('htmx:responseError', e => showToast('حدث خطأ في الاتصال', 'error'));
        document.body.addEventListener('htmx:afterSwap', e => {
            if (e.detail.target.id === 'toast-target') showToast(e.detail.target.textContent.trim(), 'success');
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
